spring:
  application:
    name: ms-account-reservation

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  lifecycle:
    timeout-per-shutdown-phase: 45s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoint:
    heapdump:
     access: read-only

  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health,threaddump,heapdump