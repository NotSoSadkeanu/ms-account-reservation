databaseChangeLog:
  - changeSet:
      id: 001-create-account-status
      author: ms-account-reservation
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: account_status
      changes:
        - createTable:
            tableName: account_status
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-create-client
      author: ms-account-reservation
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: client
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: citizenship
                  type: VARCHAR(255)
              - column:
                  name: client_type
                  type: VARCHAR(255)
              - column:
                  name: document_number
                  type: VARCHAR(255)
              - column:
                  name: document_series
                  type: varchar(255)
              - column:
                  name: document_type
                  type: VARCHAR(255)
              - column:
                  name: mdm_code
                  type: bigint