databaseChangeLog:
  - changeSet:
      id: 005-add-created-at-account-status
      author: ms-account-reservation
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: account_status
                columnName: created_at
      changes:
        - addColumn:
            tableName: account_status
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
